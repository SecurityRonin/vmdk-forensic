name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@9234e1fa9f85b14a8d6fddc7a8f7378f7e30b183
    with:
      # Carries across the existing gate verbatim. The hand-written coverage job
      # ran `cargo llvm-cov --workspace --all-features --summary-only
      # --fail-under-lines 97`. The 97 is deliberate — the residual uncovered
      # lines are env-gated paths that no honest `// cov:unreachable` annotation
      # covers. Inheriting the default strict per-line gate would raise the bar,
      # so the floor moves across unchanged.
      coverage-gate: floor
      coverage-floor: 97
      # The corpus job builds its VMDK fixtures with qemu-img, so the runner
      # needs qemu-utils before anything links or runs. The hand-written
      # workflow installed it with an explicit `sudo apt-get install -y
      # qemu-utils` step; this input is the same decision expressed as config.
      system-packages: qemu-utils
      # The hand-written test job ran on ubuntu-latest only — no `matrix.os`.
      # qemu-utils is a Linux package, so the fixture path is Linux-only by
      # construction. Leaving the default (true) would add macOS and Windows
      # runners that cannot satisfy that dependency.
      os-matrix: false
